# /etc/nginx/sites-available/sibamotor  — replace example.com, then: certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 8m;   # uploads are limited to 5 MB (sent as base64)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app reads the client IP from X-Real-IP for login rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
