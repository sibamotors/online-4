# /etc/nginx/sites-available/sibamotor  — replace example.com, then: certbot --nginx -d example.com
server {
    listen 80;
    server_name example.com;

    client_max_body_size 8m;   # uploads are limited to 5 MB (sent as base64)

    # Basic security headers (the app itself sends none)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # microphone, camera and screen sharing are allowed on this site only
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;

    # Content-Security-Policy. It starts in report-only mode (the browser console lists what it WOULD block);
    # once the pages work with no violations, rename it to "Content-Security-Policy" to enforce it.
    # 'unsafe-inline' for scripts is still needed because the framework puts small inline scripts in the page.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    # After HTTPS works (certbot), also add:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # the service worker and the manifest must always be fresh
    location = /sw.js {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache" always;
        types { application/manifest+json webmanifest; }
    }

    # live updates and the conference room (Server-Sent Events): no buffering, long timeout
    location ~ ^/api/(events|rtc)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app reads the client IP from X-Real-IP for login rate limiting.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
